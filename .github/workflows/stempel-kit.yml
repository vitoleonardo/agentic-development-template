# Tests for the kit: the core's suites always, each extension's suites when its folder changed (CORE-AC23), and
# the TypeScript adapter's quality gates on the demo app with the kit installed. Nothing here spends tokens.
name: stempel-kit

# No path filters: "Core tests" and "Demo app gates" are the required status checks, and a filtered required
# check would leave pull requests that do not touch the kit waiting forever. The "Extension <name>" jobs exist
# only when the selection names them, so they are not required.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugins/stempel-kit

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck -s sh -S warning install.sh kit/.claude/bin/* kit/.claude/hooks/guard kit/.claude/hooks/record-edit kit/.claude/hooks/check-edits kit/.claude/hooks/lib.sh tests/*.sh tests/*/run.sh ../stempel-kit-improve/tests/leadtime/fake-gh adapters/python/.claude/bin/pytest-related ../stempel-kit-*/plugin/bin/* ../stempel-kit-*/plugin/hooks/[!h]* ../stempel-kit-*/tests/*.sh ../stempel-kit-*/tests/*/run.sh
      - name: Core suites
        run: sh tests/run.sh --core
      - name: Core suites under dash
        run: KIT_TEST_SHELL=dash sh tests/run.sh --core

  # An extension's tests run when its folder changed, and all of them when the core or this workflow changed
  # (CORE-AC23). tests/*/run.sh spend tokens and run in agent-tests.yml only.
  changes:
    name: Changed extensions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      extensions: ${{ steps.select.outputs.extensions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select the extensions whose folders changed
        id: select
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git cat-file -e "$base" 2>/dev/null; then git diff --name-only "$base" HEAD; else echo plugins/stempel-kit/; fi |
            sh tests/run.sh --select | jq -Rsc 'split("\n") | map(select(. != ""))' | sed 's/^/extensions=/' >>"$GITHUB_OUTPUT"

  extension:
    name: Extension ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.extensions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.changes.outputs.extensions) }}
    steps:
      - uses: actions/checkout@v7
      - name: Suites
        run: sh tests/run.sh --extension ${{ matrix.name }}
      - name: Suites under dash
        run: KIT_TEST_SHELL=dash sh tests/run.sh --extension ${{ matrix.name }}

  demo:
    name: Demo app gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_COLOR: "1"
      KIT_BASE: main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install the kit into a copy of the demo
        run: |
          demo="$RUNNER_TEMP/demo"
          cp -R examples/demo-app "$demo"
          ./install.sh "$demo" --adapter typescript --preset nextjs
          cd "$demo"
          npm ci
          git init -q -b main
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm base --allow-empty
          git checkout -q -b change
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "demo with kit"
          echo "DEMO=$demo" >>"$GITHUB_ENV"
      - name: Spec lint
        working-directory: ${{ env.DEMO }}
        run: .claude/bin/spec-lint
      - name: Typecheck
        working-directory: ${{ env.DEMO }}
        run: .claude/bin/check --against-baseline typecheck
      - name: Lint
        working-directory: ${{ env.DEMO }}
        run: .claude/bin/check --against-baseline lint
      - name: Tests
        working-directory: ${{ env.DEMO }}
        run: .claude/bin/check --against-baseline test
      - name: Coverage
        working-directory: ${{ env.DEMO }}
        run: .claude/bin/check --against-baseline coverage
      - name: Build
        working-directory: ${{ env.DEMO }}
        run: .claude/bin/check build
