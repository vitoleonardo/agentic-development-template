# The tests that spend tokens: every tests/*/run.sh of the core and the extensions, run by
# plugins/stempel-kit/tests/agent-tests.sh until KIT_TEST_BUDGET_USD (a repository variable; 10 USD when unset)
# is spent. Weekly and on request only; never on a push or a pull request (CORE-AC24).
name: agent-tests

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a workflow_dispatch during the weekly run would double the spend.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  agent-tests:
    name: Agent tests within the budget
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KIT_TEST_BUDGET_USD: ${{ vars.KIT_TEST_BUDGET_USD }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v7
      # The runners' tools: Claude Code for every run, pnpm and uv for the onboard fixtures, the Playwright
      # Chromium build of the demo app for the fix-bug and verify runs.
      - name: Install Claude Code and pnpm
        run: npm install -g @anthropic-ai/claude-code pnpm
      - name: Install the demo app's Playwright browser
        working-directory: plugins/stempel-kit/examples/demo-app
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run the agent tests until the budget is spent
        run: KIT_TEST_TRANSCRIPTS="$RUNNER_TEMP/transcripts" sh plugins/stempel-kit/tests/agent-tests.sh
      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts
          path: ${{ runner.temp }}/transcripts
          if-no-files-found: ignore
