# Stack adapter: Python with uv. Sourced by .claude/bin/check (POSIX sh), from the package's folder.
# The project needs ruff, pytest and pytest-cov as dev dependencies, plus mypy or pyright.

# Typecheck with pyright when the project configures it, else mypy.
if [ -f pyrightconfig.json ] || grep -qs '^\[tool\.pyright\]' pyproject.toml; then
  KIT_TYPECHECK="uv run pyright"
else
  KIT_TYPECHECK="uv run mypy ."
fi
KIT_LINT="uv run ruff check --output-format=concise ."
KIT_FORMAT="uv run ruff format"

# A package with a [build-system] builds a wheel; an application has nothing to build.
if grep -qs '^\[build-system\]' pyproject.toml; then
  KIT_BUILD="uv build"
else
  KIT_BUILD="n/a: application without a [build-system] in pyproject.toml"
fi

# The full suite, writing a JUnit report so the baseline can tell legacy failures from new ones.
KIT_TEST="uv run pytest --junitxml=.work/junit.xml"
KIT_TEST_REPORT=".work/junit.xml"

# pytest has no "related tests" mode: the helper runs the test files given, and test_<name>.py for each
# source file; when a source file has no such test, it runs the whole suite.
KIT_TEST_RELATED="sh \"\$KIT_BIN/pytest-related\""

# Coverage written to coverage.json (coverage.py JSON), also when tests fail (the test gate judges those).
KIT_COVERAGE="uv run pytest --cov --cov-report=json:coverage.json --cov-report=term -q"
KIT_COVERAGE_FILES="uv run python \"\$KIT_BIN/coverage-files.py\""
KIT_COVERAGE_PCT="uv run python \"\$KIT_BIN/coverage-files.py\" --total"
KIT_COVERAGE_EXCLUDE="conftest.py"
KIT_COVERAGE_THRESHOLD="70"
KIT_COVERAGE_TOLERANCE="0.5"

# Duplicated code, with the jscpd 5 binary on PATH (brew install jscpd, cargo install jscpd or npm i -g jscpd).
# Tests are left out. Without jscpd these stay empty: the edit hook skips them, /verify-feature fails until it is installed.
if command -v jscpd >/dev/null 2>&1; then
  jscpd="jscpd . --format python --ignore '**/tests/**,**/test_*.py,**/conftest.py' --baseline-from-ref \"\$KIT_BASE\" --reporters ai --no-colors"
  KIT_DUPLICATES="$jscpd --ignore-identifiers --fail-on-new-clones 0"
  KIT_DUPLICATES_RELATED="$jscpd --ignore-identifiers --changed --fail-on-new-clones 0"
  KIT_SIMILAR="$jscpd --similarity --kind ast"
fi

KIT_MAX_CHANGED_LINES="400"

# /verify-feature: set these to the project's own commands (see the kit's docs/customizing.md).
# KIT_SEED="uv run python -m scripts.seed"     prints "seed: <version>"
# KIT_E2E="uv run pytest tests/e2e"
# KIT_E2E_RELATED="uv run pytest"                  only the affected e2e tests; see the core kit.conf
# KIT_E2E_PATTERNS="tests/e2e/test_*.py"
# KIT_E2E_FULL_PATTERNS="pyproject.toml uv.lock */conftest.py"
# KIT_TEST_MOCKED="uv run pytest -m 'not live'" prints "mocked: <what>"
KIT_SETUP="uv sync --locked"

KIT_SOURCE_PATTERNS="*.py"

KIT_TEST_PATTERNS="test_*.py *_test.py conftest.py */tests/*"

KIT_DANGEROUS_PATTERNS='alembic[[:space:]]+downgrade[[:space:]]+base
manage\.py[[:space:]]+flush'

# Model routing for dispatched agents (.claude/bin/route). Tiers map to model aliases; the Agent tool takes
# aliases only: sonnet, opus, haiku, fable. Spec, plan and PR description run on the session model.
KIT_MODEL_FAST="haiku"
KIT_MODEL_STANDARD="sonnet"
KIT_MODEL_DEEP="opus"
KIT_ROUTE_EXPLORE="fast"
KIT_ROUTE_IMPLEMENT="standard"
KIT_ROUTE_TESTS="standard"
KIT_ROUTE_REVIEW="deep"
KIT_ROUTE_VERIFY="standard"
# Tokens (input, output and cache writes) a branch may use; empty means no budget. The usage hook warns
# at 80 percent and blocks the next dispatch at 100 percent.
KIT_BUDGET_TOKENS=""

# Run records in reports/runs/ and the /improve-kit loop (.claude/bin/runs). Empty: off; "1": on.
KIT_IMPROVE=""
