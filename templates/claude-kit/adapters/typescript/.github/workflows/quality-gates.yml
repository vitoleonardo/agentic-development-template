# Quality gates for every pull request, whoever wrote the code.
# Every check goes through .claude/bin/check, so .claude/kit.conf decides what runs.
# Make "Quality gates" a required status check in the branch protection rules, so a red run blocks the merge.
name: Quality gates

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "70" # percent of changed lines that tests must cover
  MAX_CHANGED_LINES: "400" # above this the PR gets a warning to split it
  NO_COLOR: "1"

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/* # or node-version-file: package.json to use engines.node
          package-manager-cache: false

      - name: Install dependencies
        id: install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            version=$(node -p "(require('./package.json').packageManager || 'pnpm@10').split('@')[1].split('+')[0]")
            npm install --global "pnpm@$version"
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Diff size
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --numstat "$BASE_REF...HEAD" -- . \
            ':(exclude,glob)**/package-lock.json' ':(exclude,glob)**/pnpm-lock.yaml' \
            ':(exclude,glob)**/yarn.lock' ':(exclude,glob)**/*.snap' |
            awk '{ total += ($1 == "-" ? 0 : $1) + ($2 == "-" ? 0 : $2) } END { print total + 0 }')
          echo "Changed lines (without lockfiles and snapshots): $changed" >>"$GITHUB_STEP_SUMMARY"
          if [ "$changed" -gt "$MAX_CHANGED_LINES" ]; then
            echo "::warning title=Large pull request::$changed changed lines (limit $MAX_CHANGED_LINES). Consider splitting it into smaller pull requests; small diffs get better reviews."
          fi

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .claude/bin/check typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .claude/bin/check lint

      - name: Tests with coverage
        id: coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .claude/bin/check coverage

      - name: Coverage on changed files
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node .github/scripts/changed-coverage.mjs

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .claude/bin/check build
