# The Risk check (specs/risk-gates.md): ranks each pull request's own diff with .claude/bin/risk and, when the rank is
# high (an architecture change, a security-relevant path, the build's own checks, very complex work), passes only with
# an approval on the head commit by someone with write access who is not the pull request's author.
# It runs on pull_request_target, so the workflow, .claude/bin/risk and kit.conf come from the base branch and a pull
# request cannot change the rules it is judged by; the pull request's commits are only read as data, never run.
# A review reruns it. Make "Risk" a required status check next to "Quality gates", "Evidence", "kit/e2e" and
# "kit/mutation". The build pushes as a bot identity (KIT_BOT_GH_CONFIG), so its author is never the person who
# approves.
name: Risk

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    name: Risk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stacks from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Stacked pull requests from forks are not supported; this check does not rank them."
          exit 1

      # Always the base branch's files, also on a review event, whose default checkout would be the pull request.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rank the diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch -q origin "+refs/pull/$PR/head:refs/kit/risk-head"
          ranked=$(.claude/bin/risk diff --from "$BASE_SHA" --to "$HEAD_SHA" 2>&1)
          code=$?
          printf '### Risk\n\n```text\n%s\n```\n' "$ranked" >>"$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$ranked"
          [ "$code" -ne 2 ] || { echo "::error::.claude/bin/risk could not rank this diff."; exit 1; }
          [ "$code" -eq 1 ] || exit 0
          approvals=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq "[.[] | select(.state == \"APPROVED\"
            and .commit_id == \"$HEAD_SHA\" and .user.login != \"$AUTHOR\"
            and (.author_association == \"OWNER\" or .author_association == \"MEMBER\" or .author_association == \"COLLABORATOR\"))] | length")
          if [ "${approvals:-0}" -gt 0 ]; then
            echo "High risk, approved on $HEAD_SHA."
            exit 0
          fi
          echo "::error::High risk: a person with write access other than the author approves this pull request on its head commit."
          exit 1
