# Stack adapter settings, sourced by .claude/bin/check (POSIX sh).
# Copy an adapter from the kit's adapters/ folder over this file, or fill it in by hand.
# Each value is a command. Files are appended for test-related, format and duplicates-related.
# Leave a value empty if the project has no such check; it then reports "not configured".
# A check the project cannot have says why: KIT_BUILD="n/a: library, no build step".
# In a monorepo, a package can have its own <package>/.claude/kit.conf; it applies to the files below it.

KIT_TYPECHECK=""
KIT_LINT=""
KIT_TEST=""
KIT_TEST_RELATED=""
# More checks an adapter may set: KIT_COVERAGE (full test run with coverage, for `check coverage`).
KIT_FORMAT=""
KIT_BUILD=""

# Shell patterns of source files the edit hooks react to, separated by spaces.
KIT_SOURCE_PATTERNS=""

# The guard's defaults hold unless an adapter sets them: KIT_TEST_PATTERNS, the test files the test-writer agent may
# edit (*.test.*, *.spec.*, tests/, __tests__/, e2e/, ...), and KIT_DANGEROUS_PATTERNS, stack-specific destructive
# commands the guard blocks, one extended regex per line.

# Diffs above this many changed lines (without lockfiles and snapshots) get a warning; above twice as many,
# /verify-feature fails, and a build stops after the group that passes it. CI reads the same value.
# A plan that stays one PR can approve its own limit: "Approved size: <n> lines" in the state file.
KIT_MAX_CHANGED_LINES="400"

# Paths nobody may read or change, relative to the root, separated by spaces (licence-restricted, vendored).
# The guard blocks them; the sandbox's denyRead in settings.json is what enforces it (see /onboard).
KIT_PROTECTED_PATHS=""

# Which approval gates ask the user first (.claude/bin/gate). The environment wins: KIT_APPROVAL=strict claude.
# Unset, the gates run at strict. autonomous: no gate asks unless the risk rank (stempel-kit-risk) ranks the plan or a
# stack layer high; without that extension a plan asks. standard: spec and plan ask, the rest decide
# and log under Decisions to review in .work/<branch>.md. strict: every gate asks, and a person merges.
# Secrets, protected paths, force push and deletes always ask or block (docs/customizing.md, "Merge by risk").
KIT_APPROVAL="autonomous"
# One gate on its own: KIT_GATE_<SPEC|PLAN|DEPS|SPLIT|CONFIG|COMMIT|PUSH>="ask" or "auto", for example
# KIT_GATE_PUSH="ask"
