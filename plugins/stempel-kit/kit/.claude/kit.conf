# Stack adapter settings, sourced by .claude/bin/check (POSIX sh).
# Copy an adapter from the kit's adapters/ folder over this file, or fill it in by hand.
# Each value is a command. Files are appended for test-related, format and duplicates-related.
# Leave a value empty if the project has no such check; it then reports "not configured".
# A check the project cannot have says why: KIT_BUILD="n/a: library, no build step".
# In a monorepo, a package can have its own <package>/.claude/kit.conf; it applies to the files below it.

KIT_TYPECHECK=""
KIT_LINT=""
KIT_TEST=""
KIT_TEST_RELATED=""
# Full test run with coverage.
KIT_COVERAGE=""
KIT_FORMAT=""
KIT_BUILD=""

# Shell patterns of source files the edit hooks react to, separated by spaces.
KIT_SOURCE_PATTERNS=""

# Shell patterns of test files; the test-writer agent may only edit these and the root's KIT_E2E_PATTERNS.
# Empty means the kit's defaults (*.test.*, *.spec.*, tests/, __tests__/, e2e/, ...).
KIT_TEST_PATTERNS=""

# Stack-specific destructive commands the guard blocks, one extended regex per line.
KIT_DANGEROUS_PATTERNS=""

# Diffs above this many changed lines (without lockfiles and snapshots) get a warning; above twice as many,
# /verify-feature fails, and a build stops after the group that passes it. CI reads the same value.
# A plan that stays one PR can approve its own limit: "Approved size: <n> lines" in the state file.
KIT_MAX_CHANGED_LINES="400"

# Files whose change makes a layer high, so a person approves its merge (auth, migrations); at standard the push asks
# (.claude/bin/gate). Shell patterns, separated by spaces. KIT_GATE_PUSH="auto" turns this off.
KIT_PUSH_ASK_PATTERNS=""

# Paths nobody may read or change, relative to the root, separated by spaces (licence-restricted, vendored).
# The guard blocks them; the sandbox's denyRead in settings.json is what enforces it (see /onboard).
KIT_PROTECTED_PATHS=""

# Model routing for dispatched agents (.claude/bin/route). Tiers map to model aliases; the Agent tool takes
# aliases only: sonnet, opus, haiku, fable. Spec, plan and PR description run on the session model.
KIT_MODEL_FAST="haiku"
KIT_MODEL_STANDARD="sonnet"
KIT_MODEL_DEEP="opus"
KIT_ROUTE_EXPLORE="fast"
KIT_ROUTE_IMPLEMENT="standard"
KIT_ROUTE_TESTS="standard"
KIT_ROUTE_REVIEW="deep"
KIT_ROUTE_VERIFY="standard"
# Reasoning effort of autopilot's group sessions per tier: low, medium, high, xhigh or max; empty is the session's
# own default. A group whose checks fail resumes one tier up with that tier's effort, and a deep group at max.
# CLAUDE_CODE_EFFORT_LEVEL in the environment overrides all three (.claude/bin/route check warns).
KIT_EFFORT_FAST=""
KIT_EFFORT_STANDARD=""
KIT_EFFORT_DEEP=""
# The cache hit rate (cache reads over every token sent, in percent) below which the PR's cost line names it.
# Empty: the rate is shown without a minimum.
KIT_CACHE_MIN_PERCENT="90"
# Tokens (input, output and cache writes) a branch may use; empty means no budget. The usage hook warns
# at 80 percent and blocks the next dispatch at 100 percent. The environment wins, as for KIT_IMPROVE below.
KIT_BUDGET_TOKENS=""

# Run records in reports/runs/ and the /improve-kit loop (.claude/bin/runs). Empty: off; "1": on.
# .claude/bin/autopilot turns it on for its sessions.
KIT_IMPROVE=""

# Which approval gates ask the user first (.claude/bin/gate). The environment wins: KIT_APPROVAL=strict claude.
# autonomous (the default): no gate asks unless .claude/bin/risk ranks the plan or a stack layer high (an architecture
# change, a file in KIT_PUSH_ASK_PATTERNS or KIT_ARCHITECTURE_PATTERNS, the build's own checks, very complex work);
# the build merges a stack that ranks below high once its stage is green. standard: spec and plan ask, the rest decide
# and log under Decisions to review in .work/<branch>.md. strict: every gate asks, and a person merges.
# Secrets, protected paths, force push and deletes always ask or block (docs/customizing.md, "Merge by risk").
KIT_APPROVAL="autonomous"
# The risk score from which a plan or layer is high, so a person approves it; half of it is medium.
KIT_RISK_HUMAN="8"
# Files whose change is an architecture change, high whatever the score: module boundaries, shared core, ADRs.
KIT_ARCHITECTURE_PATTERNS=""
# How the build merges a stack: squash, merge or rebase.
KIT_MERGE_METHOD="squash"
# A GH_CONFIG_DIR logged in as the build's own GitHub account (a GitHub App or a machine user), so a person other than
# the author can approve a high-ranked pull request. Without it the build pushes as you.
KIT_BOT_GH_CONFIG=""
# One gate on its own: KIT_GATE_<SPEC|PLAN|DEPS|SPLIT|CONFIG|COMMIT|PUSH>="ask" or "auto", for example
# KIT_GATE_PUSH="ask"
