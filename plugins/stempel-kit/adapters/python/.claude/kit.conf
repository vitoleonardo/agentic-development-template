# Stack adapter: Python with uv. Sourced by .claude/bin/check (POSIX sh), from the package's folder.
# The project needs ruff, pytest and pytest-cov as dev dependencies, plus mypy or pyright.

# Typecheck with pyright when the project configures it, else mypy.
if [ -f pyrightconfig.json ] || grep -qs '^\[tool\.pyright\]' pyproject.toml; then
  KIT_TYPECHECK="uv run pyright"
else
  KIT_TYPECHECK="uv run mypy ."
fi
KIT_LINT="uv run ruff check --output-format=concise ."
KIT_FORMAT="uv run ruff format"

# A package with a [build-system] builds a wheel; an application has nothing to build.
if grep -qs '^\[build-system\]' pyproject.toml; then
  KIT_BUILD="uv build"
else
  KIT_BUILD="n/a: application without a [build-system] in pyproject.toml"
fi

# The full suite, writing a JUnit report so the baseline can tell legacy failures from new ones.
KIT_TEST="uv run pytest --junitxml=.work/junit.xml"

# pytest has no "related tests" mode: the helper runs the test files given, and test_<name>.py for each
# source file; when a source file has no such test, it runs the whole suite.
KIT_TEST_RELATED="sh \"\$KIT_BIN/pytest-related\""

# Coverage written to coverage.json (coverage.py JSON), also when tests fail (the test gate judges those).
KIT_COVERAGE="uv run pytest --cov --cov-report=json:coverage.json --cov-report=term -q"

KIT_MAX_CHANGED_LINES="400"

KIT_SOURCE_PATTERNS="*.py"

KIT_TEST_PATTERNS="test_*.py *_test.py conftest.py tests/*"

KIT_DANGEROUS_PATTERNS='alembic[[:space:]]+downgrade[[:space:]]+base
manage\.py[[:space:]]+flush'

# Which approval gates ask the user first (.claude/bin/gate). The environment wins: KIT_APPROVAL=strict claude.
# Unset, the gates run at strict. autonomous: no gate asks unless the risk rank (stempel-kit-risk) ranks the plan or a
# stack layer high; without that extension a plan asks. standard: spec and plan ask, the rest decide
# and log under Decisions to review in .work/<branch>.md. strict: every gate asks, and a person merges.
# Secrets, protected paths, force push and deletes always ask or block (docs/customizing.md, "Merge by risk").
KIT_APPROVAL="autonomous"
# One gate on its own: KIT_GATE_<SPEC|PLAN|DEPS|SPLIT|CONFIG|COMMIT|PUSH>="ask" or "auto", for example
# KIT_GATE_PUSH="ask"
