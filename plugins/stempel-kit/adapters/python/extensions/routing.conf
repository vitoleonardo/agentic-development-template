# The python adapter's settings for stempel-kit-routing; install.sh --extension routing writes them as its section.
# Model routing for dispatched agents (.claude/bin/route). Tiers map to model aliases; the Agent tool takes
# aliases only: sonnet, opus, haiku, fable. Spec, plan and PR description run on the session model.
KIT_MODEL_FAST="haiku"
KIT_MODEL_STANDARD="sonnet"
KIT_MODEL_DEEP="opus"
KIT_ROUTE_EXPLORE="fast"
KIT_ROUTE_IMPLEMENT="standard"
KIT_ROUTE_TESTS="standard"
KIT_ROUTE_REVIEW="deep"
KIT_ROUTE_VERIFY="standard"
# Reasoning effort of autopilot's group sessions per tier: low, medium, high, xhigh or max; empty is the session's
# own default. A group whose checks fail resumes one tier up with that tier's effort, and a deep group at max.
# CLAUDE_CODE_EFFORT_LEVEL in the environment overrides all three (.claude/bin/route check warns).
KIT_EFFORT_FAST=""
KIT_EFFORT_STANDARD=""
KIT_EFFORT_DEEP=""
# The cache hit rate (cache reads over every token sent, in percent) below which the PR's cost line names it.
# Empty: the rate is shown without a minimum.
KIT_CACHE_MIN_PERCENT="90"
# Tokens (input, output and cache writes) a branch may use; empty means no budget. The usage hook warns
# at 80 percent and blocks the next dispatch at 100 percent.
KIT_BUDGET_TOKENS=""
