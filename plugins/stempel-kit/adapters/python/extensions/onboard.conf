# The python adapter's settings for stempel-kit-onboard; install.sh --extension onboard writes them as its section.
KIT_TEST_REPORT=".work/junit.xml"
KIT_COVERAGE_FILES="uv run python \"\$KIT_BIN/coverage-files.py\""
KIT_COVERAGE_PCT="uv run python \"\$KIT_BIN/coverage-files.py\" --total"
KIT_COVERAGE_EXCLUDE="conftest.py"
KIT_COVERAGE_THRESHOLD="70"
KIT_COVERAGE_TOLERANCE="0.5"
