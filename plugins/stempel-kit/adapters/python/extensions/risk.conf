# The python adapter's settings for stempel-kit-risk; install.sh --extension risk writes them as its section.
# Files whose change makes gate push ask at every level: auth and migrations (.claude/bin/gate).
KIT_PUSH_ASK_PATTERNS="auth/* *auth.py migrations/* alembic/*"
# The risk score from which a plan or layer is high, so a person approves it; half of it is medium.
KIT_RISK_HUMAN="8"
# Files whose change is an architecture change, high whatever the score: module boundaries, shared core, ADRs.
KIT_ARCHITECTURE_PATTERNS=""
