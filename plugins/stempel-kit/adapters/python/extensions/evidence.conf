# The python adapter's settings for stempel-kit-evidence; install.sh --extension evidence writes them as its section.
# Duplicated code, with the jscpd 5 binary on PATH (brew install jscpd, cargo install jscpd or npm i -g jscpd).
# Tests are left out. Without jscpd these stay empty: the edit hook skips them, /verify-feature fails until it is installed.
if command -v jscpd >/dev/null 2>&1; then
  jscpd="jscpd . --format python --ignore '**/tests/**,**/test_*.py,**/conftest.py' --baseline-from-ref \"\$KIT_BASE\" --reporters ai --no-colors"
  KIT_DUPLICATES="$jscpd --ignore-identifiers --fail-on-new-clones 0"
  KIT_DUPLICATES_RELATED="$jscpd --ignore-identifiers --changed --fail-on-new-clones 0"
  KIT_SIMILAR="$jscpd --similarity --kind ast"
fi
# Files whose change makes a later review or verify round cover the whole branch again (evidence scope).
KIT_CONTRACT_PATTERNS="auth/* *auth.py migrations/* alembic/* routes/* api/*"

# /verify-feature: set these to the project's own commands (see the kit's docs/customizing.md).
# KIT_SEED="uv run python -m scripts.seed"     prints "seed: <version>"
# KIT_E2E="uv run pytest tests/e2e"
# KIT_E2E_RELATED="uv run pytest"                  only the affected e2e tests; see the core kit.conf
# KIT_E2E_PATTERNS="tests/e2e/test_*.py"
# KIT_E2E_FULL_PATTERNS="pyproject.toml uv.lock */conftest.py"
# KIT_E2E_MAP=".kit/e2e-map.tsv"                   source paths to the e2e tests that cover them; see the core kit.conf
# The stack stage runs in CI only with the TypeScript adapter's stack-checks.yml; here run it in this checkout, or
# turn it off (see the core kit.conf).
KIT_STACK_CHECKS="local"
# Mutation tests: a command that takes the changed ranges as one comma-separated argument and writes a report, and
# a command that prints it as "<file> TAB <line> TAB <mutator> TAB <status>" (Killed, Timeout, Survived, NoCoverage).
# mutmut 3 mutates whole files; the kit counts only the mutants on the changed lines. Until then:
KIT_MUTATION="n/a: no mutation tool configured for this project yet"
# KIT_TEST_MOCKED="uv run pytest -m 'not live'" prints "mocked: <what>"
KIT_SETUP="uv sync --locked"
# Variables for the base-branch screenshot run (an env file, read for that run only); see the core kit.conf.
KIT_BASE_ENV=""
# The test stack's own database, Redis db and port, exported to the seed, e2e and screenshot commands; see the core kit.conf.
KIT_RUN_DB=""
KIT_RUN_REDIS_DB=""
KIT_RUN_PORT=""
# Failed verify rounds per class before /verify-feature asks (.claude/bin/gate round). kit false positives never
# count, spec changes always ask, and at autonomous test and hotfix rounds continue past the limit.
KIT_VERIFY_ROUNDS="test:3 hotfix:2"
