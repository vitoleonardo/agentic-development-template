# Stack adapter: TypeScript (npm or pnpm). Sourced by .claude/bin/check (POSIX sh).
# The project's package.json must define the scripts typecheck, lint, test and build.

if [ -f pnpm-lock.yaml ]; then
  pm=pnpm
  x="pnpm exec"
else
  pm=npm
  x="npx --no-install"
fi

KIT_TYPECHECK="$pm run typecheck"
KIT_LINT="$pm run lint"
KIT_BUILD="$pm run build"

# The full suite, writing a JUnit report so the baseline can tell legacy failures from new ones. Vitest by default.
# Jest (with jest-junit): KIT_TEST="JEST_JUNIT_OUTPUT_FILE=.work/junit.xml $x jest --reporters=default --reporters=jest-junit"
KIT_TEST="$x vitest run --reporter=default --reporter=junit --outputFile.junit=.work/junit.xml"
KIT_TEST_REPORT=".work/junit.xml"

# Tests related to the given source files. Vitest by default.
# Jest: KIT_TEST_RELATED="$x jest --findRelatedTests --passWithNoTests"
KIT_TEST_RELATED="$x vitest related --run --passWithNoTests"

# Full run with coverage, written to coverage/coverage-summary.json even when tests fail (the test gate judges those).
# Needs @vitest/coverage-v8. Jest: "$x jest --coverage --coverageReporters=json-summary --coverageReporters=text-summary"
KIT_COVERAGE="$x vitest run --coverage.enabled --coverage.reportOnFailure --coverage.reporter=json-summary --coverage.reporter=text-summary"
# Coverage per file and overall, read from that report by `check --against-baseline coverage`.
KIT_COVERAGE_FILES="node \"\$KIT_BIN/coverage-files.mjs\""
KIT_COVERAGE_PCT="node \"\$KIT_BIN/coverage-files.mjs\" --total"
# Source files that never carry coverage.
KIT_COVERAGE_EXCLUDE="*.d.ts *.config.* app/page.* app/*/page.* app/layout.* app/*/layout.* app/template.* app/*/template.* app/loading.* app/*/loading.* app/error.* app/*/error.* app/global-error.* app/*/global-error.* app/not-found.* app/*/not-found.* app/default.* app/*/default.*"
KIT_COVERAGE_THRESHOLD="70"
KIT_COVERAGE_TOLERANCE="0.5"

# Format the given files with the formatter the project configures.
if [ -f biome.json ] || [ -f biome.jsonc ]; then
  KIT_FORMAT="$x biome format --write"
else
  KIT_FORMAT="$x prettier --write --ignore-unknown"
fi

# Duplicated code, with jscpd 5 as a devDependency. Tests are left out: their repeated setup is not shared logic.
# Without jscpd installed these stay empty: the edit hook skips them, /verify-feature fails until it is installed.
# KIT_DUPLICATES runs it through duplicates-new.mjs, which also counts a clone inside one the same file pair already
# has on the base as legacy (jscpd alone reports the pieces of a split legacy clone as new). The NestJS preset adds
# an --ignore-pattern for constructor parameter lists to scan.
if [ -x node_modules/.bin/jscpd ]; then
  scan=". --format typescript,tsx,javascript,jsx --ignore '**/*.test.*,**/*.spec.*,**/e2e/**'"
  jscpd="$x jscpd $scan --baseline-from-ref \"\$KIT_BASE\" --reporters ai --no-colors"
  KIT_DUPLICATES="node \"\$KIT_BIN/duplicates-new.mjs\" node_modules/.bin/jscpd $scan --ignore-identifiers"
  KIT_DUPLICATES_RELATED="$jscpd --ignore-identifiers --changed --fail-on-new-clones 0"
  KIT_SIMILAR="$jscpd --similarity --kind ast"
fi

KIT_MAX_CHANGED_LINES="400"

# /verify-feature runs the project's own scripts when package.json defines them:
# seed, e2e, test:mocked and screenshots (see the kit's docs/customizing.md for what each must do).
has_script() { grep -Eq "\"$1\"[[:space:]]*:" package.json 2>/dev/null; }
has_script seed && KIT_SEED="$pm run seed"
has_script e2e && KIT_E2E="$pm run e2e"
has_script test:mocked && KIT_TEST_MOCKED="$pm run test:mocked"
has_script screenshots && KIT_SCREENSHOTS="$pm run screenshots"
# Playwright takes test files as arguments, so a pull request runs only the affected e2e tests (see the core kit.conf).
if [ -f playwright.config.ts ] || [ -f playwright.config.js ] || [ -f playwright.config.mjs ]; then
  has_script e2e && KIT_E2E_RELATED="$x playwright test"
  has_script screenshots && KIT_SCREENSHOTS_RELATED="$x playwright test --grep @screenshot"
  KIT_E2E_PATTERNS="e2e/*.spec.* e2e/*.test.* e2e/*.screenshots.*"
  # The e2e results count in the edge-case matrix when Playwright writes JUnit, for example in playwright.config.ts:
  # reporter: [["list"], ["junit", { outputFile: ".work/e2e-junit.xml" }]]
  KIT_E2E_REPORT=".work/e2e-junit.xml"
  KIT_E2E_FULL_PATTERNS="package.json package-lock.json pnpm-lock.yaml playwright.config.* */fixtures.* */fixtures/* global-setup.* global-teardown.*"
fi
if [ "$pm" = pnpm ]; then KIT_SETUP="pnpm install --frozen-lockfile"; else KIT_SETUP="npm ci"; fi
# Variables for the base-branch screenshot run (an env file, read for that run only); see the core kit.conf.
KIT_BASE_ENV=""

KIT_SOURCE_PATTERNS="*.ts *.tsx *.mts *.cts *.js *.jsx *.mjs *.cjs"

KIT_TEST_PATTERNS="*.test.* *.spec.* __tests__/* test/* tests/* e2e/*"

KIT_DANGEROUS_PATTERNS='prisma[[:space:]]+migrate[[:space:]]+reset
prisma[[:space:]]+db[[:space:]]+push[^;&|]*--force-reset
drizzle-kit[[:space:]]+drop'

# Model routing for dispatched agents (.claude/bin/route). Tiers map to model aliases; the Agent tool takes
# aliases only: sonnet, opus, haiku, fable. Spec, plan and PR description run on the session model.
KIT_MODEL_FAST="haiku"
KIT_MODEL_STANDARD="sonnet"
KIT_MODEL_DEEP="opus"
KIT_ROUTE_EXPLORE="fast"
KIT_ROUTE_IMPLEMENT="standard"
KIT_ROUTE_TESTS="standard"
KIT_ROUTE_REVIEW="deep"
KIT_ROUTE_VERIFY="standard"
# Tokens (input, output and cache writes) a branch may use; empty means no budget. The usage hook warns
# at 80 percent and blocks the next dispatch at 100 percent.
KIT_BUDGET_TOKENS=""

# Run records in reports/runs/ and the /improve-kit loop (.claude/bin/runs). Empty: off; "1": on.
KIT_IMPROVE=""

# Which approval gates ask the user first (.claude/bin/gate). The environment wins: KIT_APPROVAL=autonomous claude.
# strict: every gate asks. standard: spec and plan ask, the rest decide and log under Decisions to review in
# .work/<branch>.md. autonomous: no gate asks. Secrets, protected paths, force push, deletes and merging always ask or block.
KIT_APPROVAL="strict"
# One gate on its own: KIT_GATE_<SPEC|PLAN|DEPS|SPLIT|CONFIG|COMMIT|PUSH>="ask" or "auto", for example
# KIT_GATE_PUSH="ask"
# Failed verify rounds per class before /verify-feature asks (.claude/bin/gate round). kit false positives never
# count, spec changes always ask, and at autonomous test and hotfix rounds continue past the limit.
KIT_VERIFY_ROUNDS="test:3 hotfix:2"
