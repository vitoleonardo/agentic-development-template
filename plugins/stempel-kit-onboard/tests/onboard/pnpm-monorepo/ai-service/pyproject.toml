[project]
name = "assist"
version = "0.1.0"
description = "Fixture for the kit's onboarding tests: a Python service in a monorepo."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.mypy]
strict = true
files = ["src"]
